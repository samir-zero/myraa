name: Build APK
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Server URL"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - run: unzip -q myraa-android-native.zip
      - run: sed -i "s|^MYRAA_APP_URL=.*|MYRAA_APP_URL=${{ inputs.url }}|" myraa-android/gradle.properties
      - run: gradle assembleDebug
        working-directory: myraa-android
      - uses: actions/upload-artifact@v4
        with:
          name: myraa-apk
          path: myraa-android/app/build/outputs/apk/debug/app-debug.apk
